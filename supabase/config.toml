[auth]
site_url = "https://viatik-six.vercel.app"
additional_redirect_urls = [
  "https://viatik-six.vercel.app/**",
  "https://viatik-six.vercel.app/reset-password",
  "https://viatik-six.vercel.app/auth/confirm",
  "http://localhost:3000/**",
]

[auth.email.template.recovery]
subject = "Reset your password"
content_path = "./supabase/templates/recovery.html"

# Called by the notifications pg_net trigger, which authenticates with the
# x-viatik-webhook-secret header instead of a user JWT.
[functions.whatsapp-dispatcher]
verify_jwt = false

# Called by the dictation_jobs pg_net trigger and the pg_cron backstop with the
# x-viatik-webhook-secret header (TRANSCRIBE_WEBHOOK_SECRET).
[functions.transcribe-audio]
verify_jwt = false
