name: CI Debug

on:
  workflow_dispatch:

jobs:
  debug:
    name: Debug
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Debug versions
        run: |
          node --version
          npm --version
          whoami
          pwd
          ls -la

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Debug pnpm
        run: pnpm --version

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test -- --run